<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open the tutorial slide preview</title>
  <script>
    const homepage = new URL("./", location.href);
    homepage.search = location.search;
    homepage.hash = 'slides';
    location.replace(homepage);
  </script>
</head>
<body>
  <p><a href="./#slides">Open the tutorial slide preview</a></p>
</body>
</html>
